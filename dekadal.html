<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaguguta Agrifarm — Dekadal Rainfall Report</title>
<style>
  body { font-family: "Times New Roman", Times, serif; }
</style>
</head>
<body>

<h2>Dekadal Rainfall Report</h2>
<p id="generated-at"></p>
<p id="dekad-title"></p>
<hr>

<p><b>Observed</b></p>
<p id="total-rainfall"></p>
<p id="rainy-days"></p>
<p id="heaviest-day"></p>
<br>
<p><b>Daily breakdown</b></p>
<div id="daily-breakdown"></div>
<hr>

<p><b>Short-duration intensity peaks</b></p>
<div id="intensity-peaks"></div>
<hr>

<p><b>Forecast — next dekad (Open-Meteo deterministic)</b></p>
<div id="forecast-days"></div>
<br>
<p id="forecast-total"></p>
<p id="forecast-heavy"></p>
<hr>

<p><b>Commentary</b></p>
<p id="claude-narrative"></p>
<hr>

<p><a href="chart/dekadal_chart.jpg" target="_blank">Annual dekadal chart</a></p>
<p><a href="index.html">← Back</a></p>
<p style="font-size:0.8em;">Copyright &copy; 2026 <b>Gianidel Ltd.</b> Internal website. Updated on 1st, 11th and 21st of each month at 07:00 EAT.</p>

<script>
fetch("data.json")
  .then(r => r.json())
  .then(data => {

    if (data.generated_at) {
      const d = new Date(data.generated_at);
      document.getElementById("generated-at").textContent = "Last updated: " + d.toUTCString();
    }

    const dk = data.previous_dekad;

    if (!dk) {
      document.getElementById("dekad-title").textContent = "No completed dekad data available.";
      return;
    }

    document.getElementById("dekad-title").textContent = "Dekad: " + dk.dekad;

    document.getElementById("total-rainfall").textContent =
      "Total rainfall: " + (dk.total_mm || 0).toFixed(2) + " mm";
    document.getElementById("rainy-days").textContent =
      "Rainy days: " + dk.rainy_days + " of " + (dk.days ? dk.days.length : "—");
    document.getElementById("heaviest-day").textContent =
      "Heaviest day: " + (dk.heaviest_day_date || "—") + " — " + (dk.heaviest_day_mm || 0).toFixed(2) + " mm";

    const breakdownEl = document.getElementById("daily-breakdown");
    if (data.daily_history && dk.days) {
      const dekadDays = data.daily_history.filter(d => dk.days.includes(d.date));
      if (dekadDays.length > 0) {
        dekadDays.forEach(d => {
          const p = document.createElement("p");
          let line = d.date + ": " + (d.total_mm || 0).toFixed(2) + " mm";
          if (d.source === "manual") line += " (manual" + (d.note ? " — " + d.note : "") + ")";
          p.textContent = line;
          breakdownEl.appendChild(p);
        });
      } else {
        breakdownEl.innerHTML = "<p>No daily data available.</p>";
      }
    }

    const intensityEl = document.getElementById("intensity-peaks");
    const metrics = [
      { label: "Max instantaneous rate", field: "max_instant_mm_h", unit: "mm/h", date_field: "max_instant_date" },
      { label: "Max 5-min amount",       field: "max_5min_mm",      unit: "mm",   date_field: "max_5min_date"    },
      { label: "Max 10-min amount",      field: "max_10min_mm",     unit: "mm",   date_field: "max_10min_date"   },
      { label: "Max 1-hour amount",      field: "max_60min_mm",     unit: "mm",   date_field: "max_60min_date"   },
      { label: "Max 2-hour amount",      field: "max_120min_mm",    unit: "mm",   date_field: "max_120min_date"  },
    ];
    let hasIntensity = false;
    metrics.forEach(m => {
      if (dk[m.field] !== null && dk[m.field] !== undefined) {
        hasIntensity = true;
        const p = document.createElement("p");
        p.textContent = m.label + ": " + dk[m.field].toFixed(2) + " " + m.unit +
          " (" + (dk[m.date_field] || "—") + ")";
        intensityEl.appendChild(p);
      }
    });
    if (!hasIntensity) {
      intensityEl.innerHTML = "<p>No intensity data available (dry dekad or manual entries only).</p>";
    }

    const forecastEl = document.getElementById("forecast-days");
    if (data.forecast && data.forecast.daily && data.forecast.daily.length > 0) {
      const nextDekad = data.forecast.daily.slice(1, 11);
      let total = 0;
      const heavyDays = [];

      nextDekad.forEach(d => {
        const mm = d.precip_mm || 0;
        total += mm;
        heavyDays.push({ date: d.date, mm });
        const p = document.createElement("p");
        p.textContent = d.date + ": " + mm.toFixed(1) + " mm";
        forecastEl.appendChild(p);
      });

      document.getElementById("forecast-total").textContent =
        "Forecast dekadal total: " + total.toFixed(1) + " mm";

      heavyDays.sort((a, b) => b.mm - a.mm);
      const top3 = heavyDays.slice(0, 3).filter(d => d.mm > 0);
      if (top3.length > 0) {
        document.getElementById("forecast-heavy").textContent =
          "Heaviest day" + (top3.length > 1 ? "s" : "") + ": " +
          top3.map(d => d.date + " (" + d.mm.toFixed(1) + " mm)").join(", ");
      }
    } else {
      forecastEl.innerHTML = "<p>No forecast data available.</p>";
    }

    const narrative = data.dekadal_narrative;
    const narrativeEl = document.getElementById("claude-narrative");
    if (narrative) {
      narrativeEl.textContent = narrative;
    } else {
      narrativeEl.style.fontStyle = "italic";
      narrativeEl.textContent = "No commentary generated for this dekad.";
    }

  })
  .catch(err => {
    document.body.innerHTML += "<p>Error loading data.json: " + err.message + "</p>";
  });
</script>

</body>
</html>
